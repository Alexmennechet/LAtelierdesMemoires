[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cache-Control = "no-store, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/PRODUITS/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, must-revalidate"
