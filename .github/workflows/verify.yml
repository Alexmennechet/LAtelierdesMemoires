name: Verify website
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility checks
        run: |
          npm start > /tmp/atelier-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-verification
          path: test-results/
